<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус сервисов</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fa;
            color: #1f2937;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h1 { margin-top: 0; }
        .subtitle { color: #6b7280; margin-bottom: 30px; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
        }
        th { background: #f9fafb; font-weight: 600; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 14px; }
        .badge.ok { background: #d1fae5; color: #065f46; }
        .badge.fail { background: #fee2e2; color: #991b1b; }
        .badge.unknown { background: #e5e7eb; color: #374151; }
        .uptime-good { color: #059669; font-weight: 600; }
        .uptime-warn { color: #d97706; font-weight: 600; }
        .uptime-bad { color: #dc2626; font-weight: 600; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .footer { color: #9ca3af; font-size: 13px; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Статус сервисов</h1>
        <p class="subtitle">Uptime за последние 7 дней</p>
        <table>
            <thead>
                <tr>
                    <th>Сервис</th>
                    <th>Статус</th>
                    <th>Uptime</th>
                    <th>Последняя проверка</th>
                </tr>
            </thead>
            <tbody>
                
        <tr>
            <td><a href="https://ru.willitrun.ru" target="_blank">VPN сервер</a></td>
            <td><span class="badge ok">● Онлайн</span></td>
            <td class="uptime-bad">81.82%</td>
            <td>2026-09-12T18:14:25.954949</td>
        </tr>
        
            </tbody>
        </table>
        <p class="footer">Страница сгенерирована 2026-09-12 18:14:26</p>
    </div>
</body>
</html>
